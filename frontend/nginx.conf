server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # El frontend llama a /api desde el mismo origen; nginx lo reenvía al backend (ADR 009).
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Rutas de la SPA (/alta, /resultado): siempre se sirve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
